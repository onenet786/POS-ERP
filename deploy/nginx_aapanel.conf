# ==============================================================================
# ApexERP & POS Enterprise - Nginx Configuration for aaPanel Website
# Paste this block into: aaPanel -> Website -> Settings -> Config (or Reverse Proxy)
# ==============================================================================

upstream apexerppos_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name erp.yourdomain.com; # Replace with your actual domain

    # SSL Certificates (managed automatically by aaPanel Let's Encrypt)
    # ssl_certificate    /www/server/panel/vhost/cert/erp.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/erp.yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # Gzip Compression for high speed loading
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root and index
    root /www/wwwroot/POS-ERP/frontend/dist;
    index index.html;

    # Static Assets Caching (PWA, images, CSS, JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ @proxy;
    }

    # API Proxy to Node.js Backend
    location /api/ {
        proxy_pass http://apexerppos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Stream for Real-Time Event Sync
    location /ws {
        proxy_pass http://apexerppos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Single Page App Routing & PWA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @proxy {
        proxy_pass http://apexerppos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
